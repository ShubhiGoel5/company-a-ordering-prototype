<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hyderabadi House Ordering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF6EF; --paper:#FFFFFF; --ink:#1F1A17; --muted:#6F665D; --line:#E9E1D5; --soft:#F3ECE0;
  --accent:#A5301F; --accent2:#8A2517; --saffron:#E39B25; --ok:#2E7D32; --blue:#1565C0; --amber:#E08600; --red:#C62828;
  --r:16px; --shadow:0 1px 2px rgba(31,26,23,.06),0 8px 24px rgba(31,26,23,.07);
  --serif:'Fraunces',Georgia,'Times New Roman',serif; --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
a{color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:700;letter-spacing:-.01em;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.btn{border:0;border-radius:999px;padding:11px 22px;background:var(--accent);color:#fff;font-weight:600;transition:.15s;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{background:var(--accent2)}
.btn.dark{background:var(--ink)}.btn.dark:hover{background:#000}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}.btn.ghost:hover{border-color:var(--ink);background:transparent}
.btn.sm{padding:7px 14px;font-size:13px}
.btn.block{width:100%;padding:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.vm{display:inline-block;width:14px;height:14px;border:1.6px solid;border-radius:3px;position:relative;flex:none}
.vm::after{content:"";position:absolute;inset:3px;border-radius:50%}
.vm.v{border-color:#2E7D32}.vm.v::after{background:#2E7D32}
.vm.n{border-color:#8B3A12}.vm.n::after{background:#8B3A12}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--soft);color:var(--muted)}
.pill.ok{background:#E3F2E4;color:#1b5e20}.pill.warn{background:#FFF1D6;color:#8a5200}.pill.bad{background:#FBE4E1;color:#9b1c10}
.muted{color:var(--muted)} .small{font-size:12.5px}
/* ---------- site header ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(250,246,239,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr .in{display:flex;align-items:center;gap:22px;height:68px}
.logo{font-family:var(--serif);font-weight:700;font-size:22px;color:var(--accent);text-decoration:none;display:flex;align-items:center;gap:9px;letter-spacing:-.01em}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--accent);display:inline-block;position:relative}
.logo i::after{content:"";position:absolute;left:8px;top:8px;width:14px;height:14px;border-radius:50%;border:3px solid #FAF6EF;border-bottom-color:transparent;transform:rotate(-30deg)}
.nav{display:flex;gap:6px;margin-left:8px}
.nav a{padding:8px 12px;border-radius:999px;text-decoration:none;font-weight:500;color:var(--muted)}
.nav a:hover,.nav a.on{color:var(--ink);background:var(--soft)}
.hdr .sp{flex:1}
.loc{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;display:flex;gap:8px;align-items:center;max-width:260px}
.loc span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cartbtn{position:relative}
.cartbtn b{background:#fff;color:var(--accent);border-radius:999px;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;padding:0 6px}
/* ---------- hero ---------- */
.hero{padding:44px 0 26px}
.hero .grid{display:grid;grid-template-columns:1.1fr .9fr;gap:36px;align-items:center}
.hero h1{font-size:clamp(36px,5vw,60px);line-height:1.04}
.hero h1 em{color:var(--accent);font-style:normal}
.hero p.lead{font-size:18px;color:var(--muted);max-width:30em;margin:16px 0 24px}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap}
.hero .facts{display:flex;gap:18px;flex-wrap:wrap;margin-top:26px;color:var(--muted);font-size:13.5px}
.hero .facts b{color:var(--ink)}
.heroart{position:relative;aspect-ratio:1/1;max-width:470px;justify-self:center;width:100%}
.heroart .blob{position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#F6D9A0,#EDBE6B 60%,#E3A44A);}
.heroart svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 22px 24px rgba(80,40,10,.25))}
.badge{position:absolute;background:#fff;border-radius:14px;padding:10px 14px;box-shadow:var(--shadow);font-size:13px;font-weight:600}
.badge small{display:block;color:var(--muted);font-weight:500}
/* ---------- outlet strip ---------- */
.strip{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 20px;display:flex;gap:24px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}
.strip .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.strip .v{font-weight:600;font-size:16px}
.strip .sp{flex:1}
/* ---------- menu ---------- */
.menuhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:44px 0 14px;flex-wrap:wrap}
.menuhead h2{font-size:34px}
.cats{position:sticky;top:68px;z-index:20;background:var(--bg);padding:10px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.cat{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 18px;font-weight:600}
.cat.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.toggle{display:inline-flex;align-items:center;gap:8px;margin-left:auto;font-weight:500;color:var(--muted);cursor:pointer;user-select:none}
.sw{width:38px;height:22px;border-radius:999px;background:#d8cfc1;position:relative;transition:.15s;flex:none;display:inline-block}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw.on{background:var(--ok)}.sw.on::after{left:19px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:22px;margin:22px 0 10px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;transition:.18s;cursor:pointer}
.card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.card.off{opacity:.55;cursor:not-allowed}.card.off:hover{box-shadow:none;transform:none}
.card .img{aspect-ratio:16/11;background:#F4E7CF;position:relative}
.card .img svg{width:100%;height:100%;display:block}
.card .tag{position:absolute;left:12px;top:12px;background:#fff;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.card .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.card .nm{display:flex;gap:9px;align-items:center;font-weight:650;font-size:17px}
.card .ds{color:var(--muted);font-size:13.5px;flex:1}
.card .ft{display:flex;align-items:center;justify-content:space-between;gap:10px}
.price{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.spice{letter-spacing:2px;color:#C6401E;font-size:11px}
.spice i{color:#DCD3C5;font-style:normal}
/* ---------- bands ---------- */
.band{background:var(--ink);color:#fff;border-radius:24px;padding:36px 40px;margin:50px 0;display:grid;grid-template-columns:1.2fr 1fr;gap:30px;align-items:center}
.band h2{font-size:32px}.band p{color:#CFC6BA;margin:10px 0 0}
.band .steps{display:grid;gap:12px}
.band .st{background:#2A2420;border-radius:14px;padding:14px 16px;display:flex;gap:14px;align-items:center}
.band .st b{background:var(--saffron);color:#1F1A17;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
footer{background:#EFE7D8;margin-top:60px;padding:40px 0 100px;color:var(--muted);font-size:13.5px}
footer .cols{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:30px}
footer h4{margin:0 0 8px;color:var(--ink);font-size:14px}
footer p{margin:4px 0}
/* ---------- modal / drawer ---------- */
.ov{position:fixed;inset:0;background:rgba(20,14,10,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;animation:f .15s}
@keyframes f{from{opacity:0}}
.modal{background:#fff;border-radius:22px;max-width:560px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.modal .top{aspect-ratio:16/9;background:#F4E7CF}.modal .top svg{width:100%;height:100%;display:block}
.modal .in{padding:22px 24px 24px}
.opt{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer;gap:10px}
.opt.on{border-color:var(--accent);background:#FBEFEC}
.opt .l{display:flex;align-items:center;gap:10px}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid #cdbfab;flex:none;position:relative}
.opt.on .dot{border-color:var(--accent)}.opt.on .dot::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
.chk{border-radius:5px}.opt.on .chk::after{border-radius:2px}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.stepper button{border:0;background:transparent;width:36px;height:36px;font-size:18px}
.stepper span{min-width:28px;text-align:center;font-weight:600}
.drawer{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:100%;background:#fff;z-index:70;box-shadow:-20px 0 60px rgba(0,0,0,.25);display:flex;flex-direction:column;animation:s .2s}
@keyframes s{from{transform:translateX(30px);opacity:0}}
.drawer .dh{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.drawer .db{flex:1;overflow:auto;padding:8px 22px}
.drawer .df{padding:16px 22px;border-top:1px solid var(--line)}
.ci{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.ci .t{width:58px;height:58px;border-radius:12px;overflow:hidden;background:#F4E7CF;flex:none}.ci .t svg{width:100%;height:100%}
.line{display:flex;justify-content:space-between;padding:5px 0;font-variant-numeric:tabular-nums}
.line.tot{font-weight:700;font-size:18px;border-top:1.5px solid var(--ink);margin-top:8px;padding-top:12px}
.note{border-radius:12px;padding:11px 14px;font-size:13.5px;margin:10px 0}
.note.bad{background:#FBE4E1;color:#8a1c14}.note.ok{background:#E3F2E4;color:#1b5e20}.note.info{background:var(--soft);color:var(--muted)}.note.warn{background:#FFF1D6;color:#7a4a00}
input[type=text],input[type=tel],input[type=number],select,textarea{font:inherit;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
label.f{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
/* ---------- pages ---------- */
.page{padding:36px 0}
.page h1{font-size:38px;margin-bottom:6px}
.two{display:grid;grid-template-columns:1.25fr .75fr;gap:28px;align-items:start}
.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px}
.panel h3{font-size:20px;margin-bottom:6px}
.sticky{position:sticky;top:90px}
.track-big{font-family:var(--serif);font-size:54px;font-weight:700;line-height:1}
.steps5{display:flex;margin:26px 0 8px}
.s5{flex:1;text-align:center;position:relative;font-size:13px;color:#9a8f82;font-weight:500}
.s5::before{content:"";position:absolute;left:-50%;right:50%;top:13px;height:3px;background:#e1d8ca}
.s5:first-child::before{display:none}
.s5 .c{width:28px;height:28px;border-radius:50%;background:#e1d8ca;margin:0 auto 8px;position:relative;z-index:1;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
.s5.done{color:var(--ink)}.s5.done .c,.s5.done::before{background:var(--ok)}
.s5.cur{color:var(--ink);font-weight:700}.s5.cur .c{background:var(--accent);box-shadow:0 0 0 5px #f1d5d0}.s5.cur::before{background:var(--ok)}
.msg{background:var(--soft);border-radius:12px;padding:10px 14px;margin:8px 0;font-size:14px}
.msg small{color:var(--muted);display:block}
/* ---------- demo panel ---------- */
.demo{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:90;font-size:13px}
.demo .t{background:var(--ink);color:#fff;border:0;border-radius:999px;padding:9px 16px;font-weight:600;box-shadow:var(--shadow)}
.demo .pn{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);padding:16px;width:310px;margin-bottom:10px}
.demo .pn h4{margin:0 0 4px;font-size:14px}
.demo .row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.demo .row button{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;font-size:12px;font-weight:600}
.demo .row button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.demo .clock{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;z-index:200;font-size:14px;max-width:90vw;box-shadow:var(--shadow)}
/* ---------- kitchen (dark) ---------- */
body.dark{background:#14110F;color:#F3ECE2}
.kh{display:flex;align-items:center;gap:14px;padding:14px 22px;background:#1C1815;border-bottom:1px solid #2E2823;flex-wrap:wrap}
.kh .logo{color:#fff}.kh .logo i{background:var(--saffron)}
.kh select{width:auto;background:#262019;color:#fff;border-color:#3a322b;font-weight:600;font-size:16px}
.kh .sp{flex:1}
.kh .clk{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums}
.kb{border:1.5px solid #3a322b;background:#262019;color:#fff;border-radius:12px;padding:12px 18px;font-weight:600;font-size:15px}
.kb.on{background:var(--amber);border-color:var(--amber);color:#1b1100}
.kb.red{background:var(--red);border-color:var(--red)}
.kcols{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:16px 22px 40px;align-items:start}
.kcol h3{font-family:var(--sans);font-size:15px;letter-spacing:.1em;color:#B9AEA0;margin:0 0 12px;display:flex;justify-content:space-between}
.kcol h3 b{background:#2E2823;border-radius:999px;padding:0 10px;color:#fff}
.kcard{background:#211C18;border:3px solid var(--blue);border-radius:16px;margin-bottom:14px;overflow:hidden}
.kcard .h{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--blue);color:#fff}
.kcard .h .n{font-size:34px;font-weight:800;letter-spacing:.02em}.kcard .h .t{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
.kcard.amber{border-color:var(--amber)}.kcard.amber .h{background:var(--amber);color:#1b1100}
.kcard.red{border-color:var(--red)}.kcard.red .h{background:var(--red)}
.kcard.green{border-color:var(--ok)}.kcard.green .h{background:var(--ok)}
.kcard .bd{padding:14px 16px}
.kcard .it{font-size:26px;font-weight:700;line-height:1.25;margin-bottom:4px}
.kcard .meta{color:#B9AEA0;font-size:15px;margin-top:8px}
.kcard .late{display:inline-block;background:var(--red);color:#fff;font-weight:800;padding:2px 10px;border-radius:6px;font-size:16px;margin-top:6px}
.kcard .due{display:inline-block;background:var(--amber);color:#1b1100;font-weight:800;padding:2px 10px;border-radius:6px;font-size:16px;margin-top:6px}
.kcard .ac{padding:0 16px 16px}
.kcard .ac button{width:100%;padding:18px;border:0;border-radius:12px;background:#F3ECE2;color:#14110F;font-size:22px;font-weight:800}
.kban{margin:12px 22px 0;padding:12px 16px;border-radius:12px;font-weight:600;font-size:16px}
.kban.r{background:#4A1D19;color:#FFC9C2}.kban.a{background:#4A3410;color:#FFE0A8}.kban.b{background:#122E4F;color:#BEDCFF}
.empty{border:2px dashed #3a322b;border-radius:14px;padding:28px;text-align:center;color:#8C8174}
.stockgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;padding:20px 22px}
.stockb{border:2px solid #3a322b;background:#262019;color:#fff;border-radius:14px;padding:18px;text-align:left;font-size:17px;font-weight:700}
.stockb.off{background:#4A1D19;border-color:var(--red)}
.stockb small{display:block;font-weight:600;color:#B9AEA0;margin-top:6px}
.stockb.off small{color:#FFC9C2}
/* ---------- admin ---------- */
body.adm{background:#F6F2EA}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:#1F1A17;color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh}
.side .logo{color:#fff;margin:4px 8px 22px}.side .logo i{background:var(--saffron)}
.side a{display:block;padding:10px 12px;border-radius:10px;text-decoration:none;color:#CFC6BA;font-weight:500;margin-bottom:2px}
.side a.on,.side a:hover{background:#2E2824;color:#fff}
.main{padding:26px 32px 80px;min-width:0}
.main h1{font-size:30px;margin-bottom:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:18px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.stat b{display:block;font-size:30px;font-family:var(--serif)}
.stat span{color:var(--muted);font-size:13px}
table.t{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;font-size:14px}
table.t th{background:#F3ECE0;text-align:left;padding:11px 14px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
table.t td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:middle}
table.t input[type=number]{width:90px;padding:7px 9px;border-radius:8px}
.bars{display:grid;gap:10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}
.bar{display:grid;grid-template-columns:190px 1fr 40px;gap:12px;align-items:center}
.bar i{display:block;height:14px;border-radius:7px;background:var(--accent)}
@media(max-width:900px){
  .hero .grid,.two,.band,footer .cols{grid-template-columns:1fr}
  .nav{display:none}.hero{padding-top:20px}.band{padding:26px}
  .kcols{grid-template-columns:1fr}
  .shell{grid-template-columns:1fr}.side{position:static;height:auto;display:flex;flex-wrap:nowrap;overflow-x:auto;gap:4px;align-items:center;padding:12px}.side .logo{width:auto;margin:0 10px 0 0;flex:none}.side a{white-space:nowrap;margin:0!important;padding:8px 12px;flex:none}
  table.t{display:block;overflow-x:auto;white-space:nowrap}.bars,.stats{min-width:0}
  .main{padding:20px 16px}
  .bar{grid-template-columns:110px 1fr 36px}
  .sticky{position:static}
}
@media(max-width:560px){
  .wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .loc{max-width:118px;padding:7px 10px;font-size:13px}
  .hdr .in{gap:8px}
  .logo{font-size:15px;gap:6px;line-height:1.1}
  .logo i{width:24px;height:24px}
  .btn.cartbtn{padding:9px 14px}
  .drawer{width:100%}
  .modal{border-radius:22px 22px 0 0;align-self:flex-end}
  .ov{padding:0;align-items:flex-end}
  .steps5 .s5{font-size:11px}
  .track-big{font-size:42px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<div class="demo" id="demo"></div>

<script>
// ======================================================================
// DATA
// ======================================================================

const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const hhmm=m=>pad(Math.floor(m/60)%24)+':'+pad(Math.floor(m)%60);
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const ceil5=m=>Math.ceil(m/5)*5;
const item=id=>ITEMS.find(i=>i.id===id);
const outlet=()=>U.area==='none'?null:OUTLETS[U.area];
function openOrders(o){return SH.orders.filter(x=>x.outlet===o&&['received','preparing'].includes(x.status)&&!x.held);}
function spiceHtml(n){return n?`<span class="spice">${'●'.repeat(n)}<i>${'●'.repeat(3-n)}</i></span>`:'';}
function cartSub(){return U.cart.reduce((a,l)=>a+l.unit*l.q,0);}
function estimateFor(cart){
  const O=outlet(); if(!O) return null;
  const preps=cart.length?cart.map(l=>item(l.id).prep*(l.portion==='Family pack'?1.15:1)):[10];
  const mx=Math.max(...preps); const rest=preps.reduce((a,b)=>a+b,0)-mx;
  const queue=openOrders(O.id).length; const load=2.5*Math.max(0,queue-1); const busy=SH.busy[O.id]?10:0;
  const est=Math.round((mx+0.25*rest+load+busy)*10)/10; const used=Math.max(est,O.min); const leg=U.mode==='delivery'?O.leg:0;
  const now=simNow(); const promise=ceil5(Math.floor(now)+used+leg);
  return {est,min:O.min,used,leg,queue,busy,promise,usedMin:used===O.min,wait:Math.round(promise-now)};
}
function totals(){
  const sub=cartSub(); let cd=0;
  if(U.coupon){const c=COUPONS[U.coupon]; if(c&&sub>=c.min)cd=c.flat?c.flat:Math.min(c.cap,Math.round(sub*c.pct/100));}
  let pd=0; if(U.usePts) pd=Math.min(SH.pts,Math.floor((sub-cd)*SH.loy.cap/100));
  const total=sub-cd-pd; return {sub,cd,pd,total,gst:total-total/1.05,earn:Math.floor((sub-cd)/100*SH.loy.per100)};
}
function unavailable(){const O=outlet(); if(!O) return U.cart; return U.cart.filter(l=>!SH.avail[O.id][l.id]);}
function blockedReason(){
  const O=outlet(); if(!O) return 'We do not deliver to this area yet.';
  if(U.mode==='pickup'&&O.cloud) return O.name+' is delivery only.';
  if(SH.paused[O.id]) return O.name+' is temporarily not taking orders. Please try another outlet in a few minutes.';
  return null;
}

// partial refresh used when another tab changes shared state
let lastNew=SH.orders.length;
function refresh(){
  const r=route(); const f=document.activeElement; const typing=f&&['INPUT','TEXTAREA','SELECT'].includes(f.tagName);
  if(r==='/kitchen'){ const n=SH.orders.filter(o=>o.outlet===U.kOutlet&&o.status==='received'&&!o.held).length; if(n>lastNew)tone(); lastNew=n; $('#app').innerHTML=kitchenPage(); }
  else if(r.startsWith('/admin')){ if(!typing) $('#app').innerHTML=adminPage(); }
  else if(r==='/track'){ const t=$('#trk'); if(t)t.innerHTML=trackInner(); }
  else if(r==='/checkout'){ const s=$('#summary'); if(s&&!typing)s.innerHTML=summaryInner(); }
  else if(r==='/'||r===''){ const g=$('#menuGrid'); if(g)g.innerHTML=gridInner(); const s=$('#strip'); if(s)s.innerHTML=stripInner(); updateBadge(); }
  if(U.drawer) renderLayer(); renderDemo();

function cardCls(o,now){if(o.status==='ready')return 'green';const r=o.promise-now;return r<0?'red':r<=5?'amber':'';}
function kcard(o,now){
  const rem=o.promise-now; const cls=cardCls(o,now); const late=rem<0&&o.status!=='ready'; const mm=Math.floor(Math.abs(rem)); const ss=pad(Math.floor((Math.abs(rem)*60)%60));
  const label=o.status==='ready'?'READY':(late?'+':'')+mm+':'+ss;
  const act=o.status==='received'?['accept','Accept']:o.status==='preparing'?['ready','Mark ready']:['handoff',o.mode==='pickup'?'Collected':'Handed to rider'];

function addToCart(){
  const sh=U.sheet; const i=item(sh.id); const unit=SH.prices[i.id][sh.p]+sh.a.reduce((x,k)=>x+i.addons[k][1],0);
  const addons=sh.a.map(k=>i.addons[k][0]); const portion=i.portions[sh.p][0];
  const ex=U.cart.find(l=>l.id===i.id&&l.portion===portion&&l.addons.join()===addons.join());
  if(ex){ex.q+=sh.q;ex.unit=unit;} else U.cart.push({id:i.id,portion,addons,unit,q:sh.q});
  U.sheet=null; persistU(); toast(i.name+' added to your cart');
}

// ======================================================================
// RULES ENGINE (runs in every open tab, idempotent) AND CLOCK
// ======================================================================
function rules(){
  const now=simNow(); let ch=false;
  SH.orders.forEach(o=>{
    if(o.held||['out','delivered','cancelled'].includes(o.status))return;
    if(o.status==='received'&&now-o.placed>=3&&!o.a3){o.a3=true;alertAdd(o.outlet,'a',`Order ${o.id} not accepted for 3 minutes. Manager alerted.`);ch=true;}
    if(o.status==='received'&&now-o.placed>=10){o.status='cancelled';o.cancelWhy='The outlet could not take it in time. Your payment is refunded to the original source.';msg(o,'Order cancelled and refunded: the outlet did not accept it in time.');alertAdd(o.outlet,'r',`Order ${o.id} auto-cancelled and refunded (not accepted in 10 minutes).`);ch=true;}
    if(!o.alerted&&now>=o.promise+10&&['received','preparing','ready'].includes(o.status)){o.alerted=true;o.revised=ceil5(Math.floor(now)+10);msg(o,`We are running late. New time: ${hhmm(o.revised)}.`);alertAdd(o.outlet,'r',`Order ${o.id} is 10 minutes past its promise. Manager alerted; customer told the new time ${hhmm(o.revised)}.`);ch=true;}
  });
  Object.keys(SH.offSince).forEach(k=>{if(!SH.online[k]&&now-SH.offSince[k]>=3&&!SH.paused[k]){SH.paused[k]=true;alertAdd(k,'r','Tablet offline for 3 minutes. Outlet paused automatically; manager sent an SMS.');ch=true;}});
  if(ch)save();
  return ch;
}
